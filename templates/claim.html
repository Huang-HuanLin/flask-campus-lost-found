<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认领物品 - 校园失物招领</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">校园失物招领</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">首页</a>
                <a class="nav-link" href="/logout">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3>认领物品</h3>
                    </div>
                    <div class="card-body">
                        <h5 class="mb-3">{{ item.name }}</h5>
                        <p class="text-muted">{{ item.category }} · {{ item.location }}</p>

                        <form method="POST" action="/claim/{{ item.id }}">
                            <div class="mb-3">
                                <label for="claimer_name" class="form-label">姓名 *</label>
                                <input type="text" class="form-control" id="claimer_name" name="claimer_name" required>
                            </div>
                            <div class="mb-3">
                                <label for="claimer_phone" class="form-label">联系方式 *</label>
                                <input type="tel" class="form-control" id="claimer_phone" name="claimer_phone" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">确认认领</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
