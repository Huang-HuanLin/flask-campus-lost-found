<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改信息 - 校园失物招领</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">校园失物招领</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">首页</a>
                {% if current_user.is_authenticated %}
                <a class="nav-link" href="/report">发布招领</a>
                <a class="nav-link" href="/profile">个人中心</a>
                <a class="nav-link" href="/logout">退出登录</a>
                {% else %}
                <a class="nav-link" href="/login">登录</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4>修改个人信息</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">用户名</label>
                                <input type="text" class="form-control" name="username" value="{{ current_user.username }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">手机号</label>
                                <input type="text" class="form-control" name="phone" value="{{ current_user.phone or '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">新密码（不修改请留空）</label>
                                <input type="password" class="form-control" name="password" placeholder="不修改请留空">
                            </div>
                            <button type="submit" class="btn btn-primary">保存修改</button>
                            <a href="/profile" class="btn btn-secondary">返回</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
